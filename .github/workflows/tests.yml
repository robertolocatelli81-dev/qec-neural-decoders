name: tests
# The bench's own tests (tests/test_bench.py, tests/test_cos2phi.py) on the pinned versions of requirements.txt, Python 3.11.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Pinned dependencies
        run: pip install -r requirements.txt
      - name: Every test in tests/test_bench.py and tests/test_cos2phi.py runs and passes (an AssertionError exits non-zero)
        run: |
          set -o pipefail
          for t in tests/test_bench.py tests/test_cos2phi.py; do
            python "$t" | tee "$(basename "$t" .py).log"
            want=$(grep -c '^def test_' "$t")
            got=$(grep -c '^ok test_' "$(basename "$t" .py).log")
            echo "$t: tests defined: $want, passed: $got"
            test "$want" -gt 0 && test "$got" -eq "$want"
          done
